<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora MVC</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Scripts da arquitetura MVC carregados em ordem sequencial -->
    <script src="model.js" defer></script>
    <script src="view.js" defer></script>
    <script src="controller.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>

    <main class="calculadora">

        <!-- Título estrutural para acessibilidade e semântica HTML5 -->
        <header>
            <h1>Calculadora</h1>
        </header>

        <!-- Visor da calculadora -->
        <div class="display">
            <!-- Linha de histórico da expressão em andamento -->
            <div id="display-historico" data-display-history class="display-historico"></div>

            <input 
                type="text" 
                id="display" 
                data-display
                placeholder="0" 
                autocomplete="off" 
                aria-label="Visor da calculadora" 
                aria-live="polite" 
                readonly
            >
        </div>

        <!-- Grade de botões -->
        <div class="botoes">

            <!-- Linha de controle -->
            <button type="button" class="span-tudo" id="btn-limpar" data-action="clear" aria-label="Limpar visor">C</button>

            <!-- Fileira 1 -->
            <button type="button" class="numero" data-value="7">7</button>
            <button type="button" class="numero" data-value="8">8</button>
            <button type="button" class="numero" data-value="9">9</button>
            <button type="button" class="operador" data-action="operator" data-value="÷" aria-label="Dividir">&divide;</button>

            <!-- Fileira 2 -->
            <button type="button" class="numero" data-value="4">4</button>
            <button type="button" class="numero" data-value="5">5</button>
            <button type="button" class="numero" data-value="6">6</button>
            <button type="button" class="operador" data-action="operator" data-value="×" aria-label="Multiplicar">&times;</button>

            <!-- Fileira 3 -->
            <button type="button" class="numero" data-value="1">1</button>
            <button type="button" class="numero" data-value="2">2</button>
            <button type="button" class="numero" data-value="3">3</button>
            <button type="button" class="operador" data-action="operator" data-value="-" aria-label="Subtrair">-</button>

            <!-- Fileira 4 -->
            <button type="button" class="numero" data-value="0">0</button>
            <button type="button" class="decimal" data-action="decimal" data-value=".">.</button>
            <button type="button" class="igual" id="btn-igual" data-action="equals" aria-label="Calcular resultado">=</button>
            <button type="button" class="operador" data-action="operator" data-value="+" aria-label="Somar">+</button>

        </div>

    </main>

</body>
</html>
